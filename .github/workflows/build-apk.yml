# Build an installable Android APK for any branch, on demand.
#
# GitHub → Actions → "Build APK" → Run workflow → pick the branch and the
# variant → when it finishes, download the APK from the run's Artifacts
# and install it on an Android phone (allow "install unknown apps").
#
#   phase_a    — what the pilot runs today (everyone Arm A)
#   phase_b    — randomised build; your test account's arm decides A/B
#   memory_v1  — Phase A + memory v1 opt-in (dev/testing only; the server
#                kill switch meta/memory_config must also be on)
#   phase_b_templates — the Phase B package for participants and internal
#                testing (T36): PHASE_B plus the rule-arm template replies
#                (RULE_TEMPLATE_REPLIES); no FORCE_ARM, no placeholder flag.
#   phase_b_templates_reader_test — the same plus the 小讀本 placeholder
#                test unit (READER_TEST_UNIT, content says 測試) for the
#                1020c §4 phone tests.  TESTING ONLY — never give this
#                APK to a participant.  The 小讀本 section also needs
#                app_config/feature_flags.htmlReadersEnabled = true.
#
# Signing (1020j §2): every APK is signed with the project's ONE fixed
# release key, restored from four repository secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD), so each new APK installs over the previous one.
# Without them the build stops: it never falls back to a throw-away key
# (each CI machine's debug key is new, which forced an uninstall and a
# re-login on every update).  The certificate's SHA-256 is printed in the
# run summary; with the repository variable ANDROID_SIGNING_SHA256 set,
# a different certificate fails the run.  docs/release/android-signing.md.
# Flutter is pinned to the team's version (.metadata: 3.44.1, 1020p §1,
# decision 0068).  Gradle 8.12 / AGP 8.9.1 / Kotlin 2.1.0 are inside
# 3.44.1's supported range; a newer Flutter needs them raised first.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        options: [phase_a, phase_b, memory_v1, phase_b_templates, phase_b_templates_reader_test]
        default: phase_a

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Release signing key (fixed, from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets missing:$missing — see docs/release/android-signing.md. Not building with a throw-away key."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Optional repo secret: unlocks the tester tools (schedule
          # simulator, test pushes) in this build — About page, tap the
          # version 7×. Without it the build has no tester access at all.
          TESTER_PIN: ${{ secrets.TESTER_PIN }}
        run: |
          case "${{ inputs.variant }}" in
            phase_a)   DEFINES="" ;;
            phase_b)   DEFINES="--dart-define=PHASE_B=true" ;;
            memory_v1) DEFINES="--dart-define=MEMORY_V1=true" ;;
            phase_b_templates) DEFINES="--dart-define=PHASE_B=true --dart-define=RULE_TEMPLATE_REPLIES=true" ;;
            phase_b_templates_reader_test) DEFINES="--dart-define=PHASE_B=true --dart-define=RULE_TEMPLATE_REPLIES=true --dart-define=READER_TEST_UNIT=true" ;;
          esac
          if [ -n "$TESTER_PIN" ]; then
            DEFINES="$DEFINES --dart-define=TESTER_PIN=$TESTER_PIN"
          else
            echo "::notice::TESTER_PIN secret not set — tester tools stay locked in this build."
          fi
          # Printed so the run log shows which --dart-define flags went in
          # (secrets such as TESTER_PIN are masked by GitHub).
          echo "dart-defines: $DEFINES"
          flutter build apk --release $DEFINES
      - name: Signing certificate (the same for every build)
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_SHA256 }}
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          SHA=$(grep -m 1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')
          VERSION=$("$BT/aapt2" dump badging "$APK" | grep -m 1 '^package:')
          {
            echo "### APK 签名"
            echo ""
            echo "- 证书 SHA-256：\`$SHA\`"
            echo "- $VERSION"
            echo ""
            echo "每次构建这一行都应该一样。不一样就不要发给参与者。"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$SHA" ]; then
            echo "::error::Could not read the APK signing certificate."
            exit 1
          fi
          if [ -n "$EXPECTED_SHA256" ] && [ "$(echo "$EXPECTED_SHA256" | tr 'A-F:' 'a-f ' | tr -d ' ')" != "$(echo "$SHA" | tr 'A-F:' 'a-f ' | tr -d ' ')" ]; then
            echo "::error::Signing certificate $SHA is not ANDROID_SIGNING_SHA256 ($EXPECTED_SHA256). Do not give this APK to participants."
            exit 1
          fi
      # Branch names like claude/x contain "/", which artifact names forbid.
      - name: Artifact name
        id: artifact
        env:
          REF: ${{ github.ref_name }}
        run: echo "name=peizhu-${{ inputs.variant }}-${REF//\//-}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
