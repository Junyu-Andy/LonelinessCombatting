# CI — runs on every push and pull request.
#
#   flutter : 小讀本 HTML check (1020c) + analyze + every test variant
#             (tool/ci_flutter_tests.sh)
#   backend : Cloud Functions tests + Firestore rules / emulator tests
#             (tool/ci_backend_tests.sh)
#
# Results: GitHub → Actions tab, or the ✓/✗ next to each commit and PR.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned to the team's Flutter (.metadata); bump together with Gradle.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true
      - run: flutter pub get
      # 1020c §3 — every 小讀本 file in assets/readers/ (no external
      # resources, no network APIs, no phone numbers, no 「AI」「模型」
      # 「機械人」「版本」「組」, data-section, .txt, manifest, < 1 MB), then
      # the checker's own tests.  Node is preinstalled on the runner.
      - name: Reader HTML check
        run: |
          node tool/check_reader_html.js
          node test/reader_html_check/check_reader_html_test.js
      # Existing infos/warnings are known (ARCHITECTURE_NOTES.md); only
      # errors fail the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests (all build variants)
        run: tool/ci_flutter_tests.sh

  backend:
    name: Functions + Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm ci --prefix functions
          npm install -g firebase-tools
      - name: Tests
        run: tool/ci_backend_tests.sh
