name: app_demo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  # Firebase — requires `flutterfire configure` to regenerate firebase_options.dart.
  # See SETUP_FIREBASE.md.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  http: ^1.2.0
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.1
  firebase_messaging: ^15.1.0
  # Offline detection for the chat resend queue.
  connectivity_plus: ^6.0.5
  crypto: ^3.0.6
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.5
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/mock/
    - assets/images/
    - assets/agents/
    - assets/config/
    # 1020 batch 3 — 做啲嘢 tool pictures (Junyu's final art, 512×512).
    - assets/tools/
    # Phase A baseline — single source of truth shared with the Cloud
    # Functions bundle (S-3 templates, S-4 crisis resources).  Bundled so
    # the client shows the same strings the server would return.
    - functions/prompts/safety_acknowledgements.json
    - functions/prompts/crisis_resources.json

# 1014e §2.18 — App icon (10/15, Junyu's 1024 PNG).  Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
