# Codemagic：iOS 包（TestFlight 内测）。
#
# 本机 Mac 编不了 iOS（Intel Mac / Xcode 26），iOS 走 Codemagic 或另一台 Mac 的 Xcode。
# Android 参与者包走 GitHub Actions（.github/workflows/build-apk.yml，选 phase_b_templates）。
#
# 一次性外部准备（Junyu）：
#   1. Apple Developer Program（已有）；App Store Connect 里的 App，bundle id
#      hk.hku.hkuimse.withyouapp（和 ios/Runner.xcodeproj、GoogleService-Info.plist 一致）。
#   2. Codemagic：接 App Store Connect API key（integration），建 app_store_credentials
#      变量组（APP_STORE_CONNECT_* + 签名），或用 Codemagic 托管签名。
#   3. ios/Runner/GoogleService-Info.plist 已在仓库里（loneliness-pilot-dev），不用再注入；
#      下面的 Restore 步骤只在设了 GOOGLE_SERVICE_INFO_PLIST 时覆盖它。
#
# 参与者包的编译开关和 Android 的 phase_b_templates 完全一样：
#   --dart-define=PHASE_B=true --dart-define=RULE_TEMPLATE_REPLIES=true
# 少了任何一个都不是 Phase B 的包（会显示 Phase A 界面，或规则组没有模板回应）。
# 不要加 FORCE_ARM、TESTER_PIN、RULE_TEMPLATE_REPLIES_ALLOW_PLACEHOLDER。
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  ios-testflight:
    name: iOS · TestFlight (internal)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.35.3 # team's version (.metadata); bump with Gradle
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials # TODO: APP_STORE_CONNECT_* + signing vars
      vars:
        BUNDLE_ID: "hk.hku.hkuimse.withyouapp"
        # T36 同款编译开关；改这里要同时改 .github/workflows/build-apk.yml 的 phase_b_templates
        DART_DEFINES: "--dart-define=PHASE_B=true --dart-define=RULE_TEMPLATE_REPLIES=true"
    integrations:
      app_store_connect: codemagic_asc_api_key # TODO: name of your ASC API key
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Restore GoogleService-Info.plist
        script: |
          # 仓库里已有 plist；只有设了 GOOGLE_SERVICE_INFO_PLIST 才覆盖
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode \
              > ios/Runner/GoogleService-Info.plist
          fi
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Analyze + test (fast gate)
        script: |
          flutter analyze || true
          flutter test || true
      - name: Build IPA
        script: |
          echo "dart-defines: $DART_DEFINES"
          flutter build ipa --release $DART_DEFINES \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers only for the test week; no external review needed.
        beta_groups:
          - Internal Testers # TODO: create this group in App Store Connect
