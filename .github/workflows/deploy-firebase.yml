# Deploy Firestore rules/indexes and Cloud Functions — manual only.
#
# Never runs on push. Someone clicks Run workflow, picks what to deploy,
# and (once the "production" environment has required reviewers) a second
# person approves before anything reaches the live project.
#
# One-time setup (repo Settings):
#   1. Secrets and variables → Actions → New secret
#      FIREBASE_SERVICE_ACCOUNT = the JSON key of a Google Cloud service
#      account with the Firebase Admin role on loneliness-pilot-dev.
#   2. Environments → New environment "production" → Required reviewers.
name: Deploy Firebase

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [rules, functions, rules_and_functions]
        default: rules
      confirm:
        description: Type the project id to confirm (loneliness-pilot-dev)
        required: true

jobs:
  test:
    name: Backend tests first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: |
          npm ci --prefix functions
          npm install -g firebase-tools
      - run: tool/ci_backend_tests.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    if: inputs.confirm == 'loneliness-pilot-dev'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm ci --prefix functions
          npm install -g firebase-tools
      - name: Credentials
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy
        run: |
          case "${{ inputs.target }}" in
            rules)     ONLY="firestore:rules,firestore:indexes" ;;
            functions) ONLY="functions" ;;
            rules_and_functions) ONLY="firestore:rules,firestore:indexes,functions" ;;
          esac
          firebase deploy --only "$ONLY" --project loneliness-pilot-dev --non-interactive
