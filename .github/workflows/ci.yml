# CI — runs on every push and pull request.
#
#   flutter : analyze + every test variant (tool/ci_flutter_tests.sh)
#   backend : Cloud Functions tests + Firestore rules / emulator tests
#             (tool/ci_backend_tests.sh)
#
# Results: GitHub → Actions tab, or the ✓/✗ next to each commit and PR.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # Existing infos/warnings are known (ARCHITECTURE_NOTES.md); only
      # errors fail the build.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests (all build variants)
        run: tool/ci_flutter_tests.sh

  backend:
    name: Functions + Firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm ci --prefix functions
          npm install -g firebase-tools
      - name: Tests
        run: tool/ci_backend_tests.sh
