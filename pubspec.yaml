name: app_demo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  # Firebase — requires `flutterfire configure` to regenerate firebase_options.dart.
  # See SETUP_FIREBASE.md.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  http: ^1.2.0
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.1
  firebase_messaging: ^15.1.0
  # Offline detection for the chat resend queue.
  connectivity_plus: ^6.0.5
  crypto: ^3.0.6
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.5
  record: ^6.2.1
  # 1020c 小讀本 (decision 0056-html-readers-webview): pinned exactly —
  # 4.13.1 is the newest that Flutter 3.35.3 resolved; kept when Flutter
  # went to 3.44.1 (1020p §1, decision 0067: tools only, plugins
  # unchanged).  Do not upgrade before the Phase B freeze.  Evaluation:
  # docs/dev-reports/webview-eval-20261020.md
  webview_flutter: 4.13.1
  # Same versions the lock already had; listed directly because the reader
  # calls Android setTextZoom(100) / iOS setAllowsLinkPreview(false).
  webview_flutter_android: 4.12.0
  webview_flutter_wkwebview: 3.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  # 1020p §1 (decision 0067): Flutter 3.44 builds iOS plugins with Swift
  # Package Manager by default; 3.35.3 used CocoaPods.  Kept on CocoaPods so
  # the iPhone build is put together as before.  Revisit after the freeze.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/mock/
    - assets/images/
    - assets/agents/
    - assets/config/
    # 1020 batch 3 — 做啲嘢 tool pictures (Junyu's final art, 512×512).
    - assets/tools/
    # 1020c 小讀本: <id>.html, <id>.txt, manifest.json (committed as []).
    # Checked by tool/check_reader_html.js in CI.
    - assets/readers/
    # 1020o 第四节: Junyu's 人生點滴 pictures — theme_1.png … theme_4.png
    # (landing cards, 512 × 512) and scene_1.jpg … scene_4.jpg (the first
    # bubble of each week, 1024 × 768, each under 200 KB).
    - assets/reminiscence/
    # Phase A baseline — single source of truth shared with the Cloud
    # Functions bundle (S-3 templates, S-4 crisis resources).  Bundled so
    # the client shows the same strings the server would return.
    - functions/prompts/safety_acknowledgements.json
    - functions/prompts/crisis_resources.json

# 1014e §2.18 — App icon (10/15, Junyu's 1024 PNG).  Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
