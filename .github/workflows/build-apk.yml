# Build an installable Android APK for any branch, on demand.
#
# GitHub → Actions → "Build APK" → Run workflow → pick the branch and the
# variant → when it finishes, download the APK from the run's Artifacts
# and install it on an Android phone (allow "install unknown apps").
#
#   phase_a    — what the pilot runs today (everyone Arm A)
#   phase_b    — randomised build; your test account's arm decides A/B
#   memory_v1  — Phase A + memory v1 opt-in (dev/testing only; the server
#                kill switch meta/memory_config must also be on)
#
# Signed with the debug key: fine for testing, not for a store release.
# Flutter is pinned to the team's version (.metadata: 3.35.3); newer
# Flutter needs a Gradle upgrade first (android/gradle/wrapper).
name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        type: choice
        options: [phase_a, phase_b, memory_v1]
        default: phase_a

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        env:
          # Optional repo secret: unlocks the tester tools (schedule
          # simulator, test pushes) in this build — About page, tap the
          # version 7×. Without it the build has no tester access at all.
          TESTER_PIN: ${{ secrets.TESTER_PIN }}
        run: |
          case "${{ inputs.variant }}" in
            phase_a)   DEFINES="" ;;
            phase_b)   DEFINES="--dart-define=PHASE_B=true" ;;
            memory_v1) DEFINES="--dart-define=MEMORY_V1=true" ;;
          esac
          if [ -n "$TESTER_PIN" ]; then
            DEFINES="$DEFINES --dart-define=TESTER_PIN=$TESTER_PIN"
          else
            echo "::notice::TESTER_PIN secret not set — tester tools stay locked in this build."
          fi
          flutter build apk --release $DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: peizhu-${{ inputs.variant }}-${{ github.ref_name }}-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
